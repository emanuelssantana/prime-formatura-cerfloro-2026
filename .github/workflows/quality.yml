name: Quality
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: for f in plugin/prime-memoria-eventos/*.js; do node --check "$f"; done
      - run: php -l plugin/prime-memoria-eventos/prime-memoria-eventos.php
  browser-wordpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordpress-browser-report
          path: |
            playwright-report/
            test-results/
